<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMSK-2088 // НЕЙРО-ТЕРМИНАЛ</title>
<style>
  :root {
    --neon: #39ff14;
    --neon-dim: #1a7a0a;
    --magenta: #ff00e0;
    --cyan: #00fff7;
    --bg: #050505;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background:
      linear-gradient(rgba(57,255,20,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(57,255,20,.05) 1px, transparent 1px),
      radial-gradient(ellipse at center, rgba(57,255,20,.06), transparent 70%),
      var(--bg);
    background-size: 40px 40px, 40px 40px, 100% 100%, auto;
    animation: gridmove 12s linear infinite;
    color: var(--neon);
    font-family: "Courier New", monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }
  @keyframes gridmove {
    from { background-position: 0 0, 0 0, 0 0, 0 0; }
    to { background-position: 0 40px, 40px 0, 0 0, 0 0; }
  }
  #bg-rain {
    position: fixed;
    inset: 0;
    z-index: -1;
    opacity: .18;
    pointer-events: none;
  }
  /* scanlines */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg, rgba(0,0,0,0.25) 0px, rgba(0,0,0,0.25) 1px,
      transparent 1px, transparent 3px
    );
    z-index: 999;
  }
  header { text-align: center; margin-top: 30px; position: relative; }
  h1.glitch {
    font-size: clamp(1.4rem, 4vw, 2.6rem);
    letter-spacing: 4px;
    color: var(--neon);
    text-shadow:
      2px 0 var(--magenta),
      -2px 0 var(--cyan),
      0 0 18px rgba(57,255,20,.7);
    animation: glitch 3s infinite;
  }
  @keyframes glitch {
    0%, 88%, 100% { transform: none; }
    90% { transform: translate(2px, -1px) skewX(3deg); }
    92% { transform: translate(-3px, 1px); }
    94% { transform: translate(1px, 2px) skewX(-2deg); }
  }
  .sub {
    color: var(--cyan);
    font-size: .8rem;
    margin-top: 6px;
    opacity: .85;
    text-shadow: 0 0 8px rgba(0,255,247,.5);
  }
  .counter {
    font-size: 1.6rem;
    margin: 22px 0 10px;
    text-shadow: 0 0 12px rgba(57,255,20,.8);
  }
  #progress-zone {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .streak {
    font-size: .85rem;
    color: var(--magenta);
    min-height: 1.4em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    opacity: 0;
    transform: translateY(-6px);
    transition: all .3s ease;
  }
  .streak.visible { opacity: 1; transform: none; }
  .streak .label {
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(255,0,224,.7);
  }
  .streak .value {
    font-size: 1.15rem;
    font-weight: bold;
    padding: 2px 12px;
    border: 1px solid var(--magenta);
    border-radius: 3px;
    background: rgba(255,0,224,.08);
    text-shadow: 0 0 12px var(--magenta);
    box-shadow: 0 0 14px rgba(255,0,224,.35), inset 0 0 10px rgba(255,0,224,.15);
    animation: streakPulse 1.6s ease-in-out infinite;
  }
  @keyframes streakPulse {
    0%, 100% { box-shadow: 0 0 10px rgba(255,0,224,.3), inset 0 0 8px rgba(255,0,224,.12); }
    50% { box-shadow: 0 0 20px rgba(255,0,224,.6), inset 0 0 14px rgba(255,0,224,.25); }
  }
  .streak .deco { color: rgba(255,0,224,.55); text-shadow: none; }
  main {
    width: min(92vw, 1100px);
    display: flex;
    gap: 24px;
    align-items: flex-start;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 34px;
    margin-bottom: 40px;
  }
  .datablock {
    flex: 1 1 480px;
    background: #010801;
    color: var(--neon);
    text-shadow: 0 0 6px rgba(57,255,20,.7), 0 0 14px rgba(57,255,20,.35);
    border: 2px solid var(--neon-dim);
    box-shadow: 0 0 25px rgba(57,255,20,.35), inset 0 0 40px rgba(57,255,20,.08);
    padding: 18px;
    min-height: 300px;
    word-break: break-all;
    white-space: pre-wrap;
    font-size: .95rem;
    line-height: 1.45;
    resize: both;
    overflow: auto;
  }
  .options {
    flex: 0 1 260px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  button.opt {
    background: transparent;
    color: var(--neon);
    border: 2px solid var(--neon-dim);
    padding: 12px 10px;
    font-family: inherit;
    font-size: 1rem;
    cursor: pointer;
    text-align: left;
    transition: all .15s ease;
  }
  button.opt:hover {
    background: rgba(57,255,20,.15);
    box-shadow: 0 0 14px rgba(57,255,20,.6);
    transform: translateX(4px);
  }
  button.opt:disabled { opacity: .55; cursor: not-allowed; }
  #message {
    width: min(92vw, 700px);
    text-align: center;
    min-height: 2.4em;
    margin-bottom: 16px;
    font-size: 1.05rem;
  }
  #message.ok { color: var(--neon); text-shadow: 0 0 10px var(--neon); }
  #message.bad { color: var(--magenta); text-shadow: 0 0 10px var(--magenta); }
  #flagbox {
    display: none;
    width: min(92vw, 700px);
    margin-bottom: 50px;
    border: 2px solid var(--magenta);
    padding: 22px;
    text-align: center;
    font-size: 1.4rem;
    color: var(--magenta);
    text-shadow: 0 0 14px var(--magenta);
    box-shadow: 0 0 30px rgba(255,0,224,.4);
    word-break: break-all;
  }
  .footer {
    margin-top: auto;
    padding: 14px;
    font-size: .7rem;
    color: #2a5f18;
  }
</style>
</head>
<body>
<canvas id="bg-rain"></canvas>
<script>
  const cv = document.getElementById('bg-rain');
  const ctx = cv.getContext('2d');
  const chars = '01ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﬀΩ≈√≠<>[]{}#$%&*+=';
  let cols, drops;
  function resize() {
    cv.width = innerWidth;
    cv.height = innerHeight;
    const size = 16;
    ctx.font = size + 'px monospace';
    cols = Math.floor(cv.width / size);
    drops = Array(cols).fill(0).map(() => Math.random() * -50);
  }
  resize();
  addEventListener('resize', resize);
  setInterval(() => {
    ctx.fillStyle = 'rgba(5,5,5,.12)';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#39ff14';
    const size = 16;
    drops.forEach((y, i) => {
      ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * size, y * size);
      if (y * size > cv.height && Math.random() > .975) drops[i] = 0;
      else drops[i] += 1;
    });
  }, 60);
</script>
<div id="progress-zone">
  <div class="counter">ПАКЕТ №<span id="num">1</span>/<span id="total">{{ total }}</span></div>
  <div class="streak" id="streak"></div>
</div>

<main style="clear: both;">
  <div class="datablock" id="data">ЗАГРУЗКА ПАКЕТА...</div>
  <div class="options" id="options"></div>
</main>

<div id="message"></div>
<div id="flagbox"></div>

<div class="footer"></div>

<script>
const dataEl = document.getElementById('data');
const optionsEl = document.getElementById('options');
const numEl = document.getElementById('num');
const totalEl = document.getElementById('total');
const streakEl = document.getElementById('streak');
const msgEl = document.getElementById('message');
const flagEl = document.getElementById('flagbox');

let current = null;

async function loadQuestion() {
  msgEl.textContent = '';
  msgEl.className = '';
  flagEl.style.display = 'none';
  const res = await fetch('/api/question');
  current = await res.json();
  numEl.textContent = current.number;
  totalEl.textContent = current.total;
  streakEl.innerHTML = '';
  if (current.streak > 0) {
    streakEl.classList.add('visible');
    const deco1 = document.createElement('span');
    deco1.className = 'deco';
    deco1.textContent = '//';
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = 'серия перехватов';
    const value = document.createElement('span');
    value.className = 'value';
    value.textContent = current.streak;
    const deco2 = document.createElement('span');
    deco2.className = 'deco';
    deco2.textContent = '//';
    streakEl.append(deco1, label, value, deco2);
  } else {
    streakEl.classList.remove('visible');
  }
  dataEl.textContent = current.data;
  optionsEl.innerHTML = '';
  for (const opt of current.options) {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt;
    btn.onclick = () => submit(opt, btn);
    optionsEl.appendChild(btn);
  }
}

async function submit(choice, btn) {
  if (!current) return;
  document.querySelectorAll('.opt').forEach(b => b.disabled = true);
  const res = await fetch('/api/answer', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({choice})
  });
  const result = await res.json();
  if (result.correct) {
    if (result.flag) {
      msgEl.textContent = 'ДОСТУП РАЗРЕШЁН. ЯДРО ОМСКА РАЗБЛОКИРОВАНО:';
      msgEl.className = 'ok';
      flagEl.textContent = result.flag;
      flagEl.style.display = 'block';
      return;
    }
    msgEl.textContent = '>> ПАКЕТ ИДЕНТИФИЦИРОВАН. СЛЕДУЮЩИЙ...';
    msgEl.className = 'ok';
    setTimeout(loadQuestion, 600);
  } else {
    msgEl.textContent = '>> ОШИБКА ДЕШИФРОВКИ. ПРОТОКОЛ ОБНУЛЁН. НАЧИНАЕМ СНАЧАЛА.';
    msgEl.className = 'bad';
    setTimeout(loadQuestion, 1200);
  }
}

loadQuestion();
</script>
</body>
</html>

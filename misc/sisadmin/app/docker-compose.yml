services:
  backend:
    build:
      context: ./backend
      target: production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      FLAG: ${FLAG:?Create .env and set FLAG}
      SESSION_TTL_MS: ${SESSION_TTL_MS:-7200000}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-1500}
      SESSION_CREATE_RATE_LIMIT_PER_MINUTE: ${SESSION_CREATE_RATE_LIMIT_PER_MINUTE:-120}
      MAX_SESSIONS: ${MAX_SESSIONS:-300}
      MAX_SESSIONS_PER_CLIENT: ${MAX_SESSIONS_PER_CLIENT:-120}
    mem_limit: 512m
    cpus: 1.5
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-1337}:8080"
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

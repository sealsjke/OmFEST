{% extends "base.html" %}

{% block content %}

<div class="card auth">

    <h1>Вход</h1>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Никнейм"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Пароль"
            required
        >

        <button type="submit">
            Войти
        </button>

    </form>

    <p>
        Нет аккаунта?
        <a href="{{ url_for('register') }}">
            Зарегистрироваться
        </a>
    </p>

</div>

{% endblock %}

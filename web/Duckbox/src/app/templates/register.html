{% extends "base.html" %}

{% block content %}

<div class="card auth">

    <h1>Регистрация</h1>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Никнейм"
            maxlength="32"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Пароль"
            required
        >

        <button type="submit">
            Создать аккаунт
        </button>

    </form>

    <p>
        Уже есть аккаунт?
        <a href="{{ url_for('login') }}">
            Войти
        </a>
    </p>

</div>

{% endblock %}

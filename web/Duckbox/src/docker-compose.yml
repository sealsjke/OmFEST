services:
  web:
    build: .
    ports:
      - "3333"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: duckcoin
      POSTGRES_USER: duckcoin
      POSTGRES_PASSWORD: duckcoin
      SECRET_KEY: "kakayatostroka"
      FLAG: ${FLAG}
      PORT: ${PORT}
    depends_on:
      db:
        condition: service_healthy
    storage_opt:
      size: 512m

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: duckcoin
      POSTGRES_USER: duckcoin
      POSTGRES_PASSWORD: duckcoin
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duckcoin -d duckcoin"]
      interval: 3s
      timeout: 3s
      retries: 10
    storage_opt:
      size: 512m

volumes:
  pgdata:
    x-ctfd-quota: 200m

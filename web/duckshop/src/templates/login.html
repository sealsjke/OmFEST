{% extends "base.html" %}

{% block content %}

<div class="auth-card">

    <div class="duck-icon">🦆</div>

    <h1>Вход</h1>

    <p class="subtitle">
        Войдите в DuckShop
    </p>

    <form method="POST">

        <label>Логин</label>
        <input
            type="text"
            name="username"
            placeholder="Введите логин"
            required
        >

        <label>Пароль</label>
        <input
            type="password"
            name="password"
            placeholder="Введите пароль"
            required
        >

        <button type="submit">
            Войти
        </button>

    </form>

    <p class="bottom-text">
        Нет аккаунта?
        <a href="{{ url_for('register') }}">
            Зарегистрироваться
        </a>
    </p>

</div>

{% endblock %}

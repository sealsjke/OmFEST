<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #101010;
            color: #eeeeee;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 360px;
            padding: 35px;
            background: #181818;
            border: 1px solid #292929;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        h1 {
            margin: 0 0 25px;
            text-align: center;
            font-size: 24px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #101010;
            color: white;
            border: 1px solid #333;
            border-radius: 5px;
            outline: none;
        }

        input:focus {
            border-color: #666;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #eeeeee;
            color: #111;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #cccccc;
        }

        .error {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
            background: #351919;
            color: #ff7777;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

<!-- user: admin -->

<div class="login-box">
    <h1>Account Login</h1>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <input
            type="text"
            name="username"
            placeholder="Username"
            autocomplete="off"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
